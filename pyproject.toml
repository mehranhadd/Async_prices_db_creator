[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "async-prices-db-creator"
version = "1.0.0"
description = "Create a SQLite database of mobile-phone names and prices from Technolife"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "aiosqlite>=0.19",
  "beautifulsoup4>=4.12",
  "requests>=2.31",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
phone-prices-db = "async_prices_db_creator.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
